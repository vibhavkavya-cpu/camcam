name: Build Digicam IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Project
        run: xcodegen generate
      - name: Build Unsigned App
        run: |
          set -o pipefail
          xcodebuild -project Digicam.xcodeproj \
            -scheme Digicam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "(error:|warning:|BUILD )" || (grep -A 5 "error:" build.log && exit 1)
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Digicam.app Payload/
          zip -r Digicam.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digicam-IPA
          path: Digicam.ipa
