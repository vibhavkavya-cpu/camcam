name: Digicam
options:
  bundleIdPrefix: com.retro
  deploymentTarget:
    iOS: "17.0"
targets:
  Digicam:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.retro.digicam
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Digicam
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: "Digicam needs camera access to capture photographs."
        NSPhotoLibraryAddUsageDescription: "Digicam saves captured photos to your camera roll."
        NSPhotoLibraryUsageDescription: "Digicam accesses your library to save and export photos."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
